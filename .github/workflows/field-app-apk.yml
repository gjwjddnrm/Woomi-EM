# 현장점검 앱(field-app) APK 빌드
# - field-app이 바뀌어 푸시되면 자동으로 APK를 만들어 GitHub Releases(미리보기)에 올립니다.
# - 폰 브라우저로 Releases 페이지에서 APK를 바로 내려받아 설치할 수 있습니다.
# - EXPO_TOKEN 비밀값이 있으면 'eas' 작업으로 EAS Build도 돌릴 수 있습니다(수동 실행).
name: field-app APK

on:
  push:
    branches: ['**']
    paths:
      - 'field-app/**'
      - '.github/workflows/field-app-apk.yml'
  workflow_dispatch:
    inputs:
      eas:
        description: 'EAS Build로도 빌드 (EXPO_TOKEN 비밀값 필요)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: field-app-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: field-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: field-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Prebuild (android)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Gradle assembleRelease (arm64)
        working-directory: field-app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Name APK
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          NAME="field-inspection-v${VERSION}-b${GITHUB_RUN_NUMBER}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -la "$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: field-app/${{ steps.apk.outputs.name }}

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: field-app-v${{ steps.apk.outputs.version }}-b${{ github.run_number }}
          name: 현장점검 앱 v${{ steps.apk.outputs.version }} (빌드 ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            현장점검 안드로이드 앱 테스트용 APK입니다.
            폰에서 아래 .apk 파일을 눌러 내려받아 설치하세요.
            브랜치: ${{ github.ref_name }} / 커밋: ${{ github.sha }}
          files: field-app/${{ steps.apk.outputs.name }}

  eas:
    if: github.event_name == 'workflow_dispatch' && inputs.eas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: field-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: field-app/package-lock.json
      - run: npm ci
      - name: EAS Build (preview APK)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --no-wait
